[project]
name = "mcp-server-template"
version = "0.1.0"
description = "A starter template for building MCP servers in Python (mcp SDK v2)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.1.1",
]

[project.scripts]
mcp-server-template = "mcp_server_template.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_template"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
